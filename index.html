<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контрольная М3</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    section {
      margin-bottom: 40px;
    }

    #timer {
      font-size: 40px;
      margin: 10px 0;
    }

    .box {
      width: 150px;
      height: 150px;
      border: 2px solid #333;
      cursor: pointer;
    }

    .box.active {
      background-color: tomato;
    }

    .user-card {
      width: 220px;
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 12px;
    }

    .user-card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
    }

    #message {
      color: crimson;
    }
  </style>
</head>
<body>

  <section>
    <h2>Задача 4 таймер</h2>
    <div id="timer">10</div>
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
    <button id="resetBtn">Reset</button>
  </section>

  <section>
    <h2>Задача 5 блок</h2>
    <div class="box"></div>
  </section>

  <section>
    <h2>Задача 7 поиск пользователя</h2>
    <input type="text" id="loginInput" placeholder="Введите логин">
    <button id="checkBtn">Проверить</button>

    <div id="userCard"></div>
    <p id="message"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
